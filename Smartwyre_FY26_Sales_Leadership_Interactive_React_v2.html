const h=React.createElement,{useState,useEffect}=React,D=window.DASH;const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',notation:'compact',maximumFractionDigits:2}).format(n),num=n=>new Intl.NumberFormat('en-US').format(n);const rep=id=>D.reps.find(r=>r.id===id);
